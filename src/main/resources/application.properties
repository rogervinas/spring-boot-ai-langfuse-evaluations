# TODO We use .properties instead of .yml because YAML cannot have both
# spring.ai.model.embedding (scalar) and spring.ai.model.embedding.text (nested)
# at the same time, and both are needed to guard different auto-configurations.
# See https://github.com/spring-projects/spring-ai/issues/4240

spring.application.name=banking-sentinel

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable all model auto-configurations by default.
# Each profile (ollama, gemini, bedrock) overrides the relevant properties.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.embedding.text=none

spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false

server.port=8080

logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=DEBUG

management.logging.export.enabled=false
management.tracing.sampling.probability=1.0
management.tracing.export.enabled=true
management.observations.annotations.enabled=true
management.otlp.metrics.export.enabled=false
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:3000/api/public/otel/v1/traces
management.opentelemetry.tracing.export.otlp.headers.Authorization=Basic cHVibGlja2V5LWxvY2FsOnNlY3JldGtleS1sb2NhbA==
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
management.opentelemetry.resource-attributes.service.version=1.0.0
